name: GAS 接続確認

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: GitHubからソースを取得
        uses: actions/checkout@v4

      - name: Node.jsを準備
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: claspをインストール
        run: npm install -g @google/clasp@3.4.1

      - name: 認証情報を復元
        env:
          CLASP_CREDENTIALS: ${{ secrets.CLASP_CREDENTIALS }}
        run: |
          printf '%s' "$CLASP_CREDENTIALS" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"

      - name: GAS接続設定
        run: |
          echo '{"scriptId":"1IqT4ZW2YQs2kH8BaKsIaQIkrTYQyiMoweYhTF5mmLVHzpkbtTTUvXIor","rootDir":""}' > .clasp.json

      - name: GASの状態を確認
        run: clasp status
