<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>集会QRコード読み取り</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
body {
  font-family: sans-serif;
  background: #f3f6fa;
  margin: 0;
  padding: 20px;
  color: #203040;
}
main {
  max-width: 500px;
  margin: auto;
  background: white;
  padding: 20px;
  border-radius: 14px;
}
h2 { text-align: center; }
button {
  width: 100%;
  padding: 14px;
  margin: 8px 0;
  border: 0;
  border-radius: 9px;
  background: #145da0;
  color: white;
  font-size: 16px;
}
#reader { width: 100%; margin: 15px auto; }
#result {
  padding: 15px;
  background: #e7f4e8;
  border-radius: 9px;
  overflow-wrap: anywhere;
}
</style>
</head>
<body>
<main>
<h2>📱 集会QR受付</h2>
<p>カメラで会員カードのQRコードを読み取ります。</p>

<button onclick="startScan()">カメラを起動</button>
<button onclick="stopScan()">カメラを停止</button>

<div id="reader"></div>

<h3>読み取り結果</h3>
<div id="result">まだ読み取っていません。</div>

<button onclick="copyResult()">会員番号をコピー</button>
</main>

<script>
let scanner = null;
let scanning = false;
let memberNumber = '';

async function startScan() {
  try {
    if (!window.isSecureContext) {
      throw new Error('HTTPS接続が必要です。');
    }

    if (!navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia) {
      throw new Error('このブラウザではカメラを利用できません。');
    }

    if (!scanner) {
      scanner = new Html5Qrcode('reader');
    }

    await scanner.start(
      { facingMode: 'environment' },
      { fps: 10, qrbox: { width: 240, height: 240 } },
      async (text) => {
        memberNumber = text.trim().replace(/^MEMBER:/i, '');
        document.getElementById('result').textContent =
          '読み取り成功：' + memberNumber;
        await stopScan();
      },
      () => {}
    );

    scanning = true;

  } catch (e) {
    document.getElementById('result').textContent =
      'エラー：' + (e.message || e);
  }
}

async function stopScan() {
  if (scanner && scanning) {
    try {
      await scanner.stop();
      scanning = false;
    } catch (e) {
      document.getElementById('result').textContent =
        '停止エラー：' + e.message;
    }
  }
}

async function copyResult() {
  if (!memberNumber) {
    alert('先にQRコードを読み取ってください。');
    return;
  }

  try {
    await navigator.clipboard.writeText(memberNumber);
    alert('会員番号をコピーしました。');
  } catch (e) {
    alert('コピーできません。番号を手動で控えてください。');
  }
}
</script>
</body>
</html>
